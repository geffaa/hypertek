server {
    if ($host = www.hypertek100.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = hypertek100.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.hypertek100.com hypertek100.com;
    return 404; # managed by Certbot




}server {
    if ($host = api.hypertek100.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.hypertek100.com;
    return 404; # managed by Certbot


}


server {
    listen 80;
    server_name admin-hyper-tek-game.deventiatech.com;
    root /usr/share/nginx/html/hyper-tekgame-admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Compress JS/CSS/JSON/SVG on the fly when no precompressed .gz exists.
# (gzip on; already set in nginx.conf; gzip_types there is commented out,
# which limits compression to text/html only — this file widens it.)
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

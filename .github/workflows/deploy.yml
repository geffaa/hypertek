# =============================================================
# HyperTek — GitHub Actions CI/CD Pipeline
# =============================================================
# Trigger: Push to 'main' branch or manual
# Strategy: Build frontend/admin on GitHub runner → Deploy to EC2
# =============================================================

name: 🚀 Deploy HyperTek

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  NODE_VERSION: "20"
  DEPLOY_DIR: /var/www/hypertek

jobs:
  # ─────────────────────────────────────────────
  # Job: Build on GitHub Runner → Deploy to EC2
  # (no artifacts needed — build & deploy in one job)
  # ─────────────────────────────────────────────
  build-and-deploy:
    name: 🔨🚀 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      # ── Build User Frontend ──
      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_BACKEND_URL: https://api.hypertek100.com
          VITE_ADMIN_URL: https://admin.hypertek100.com
          VITE_MY_NFT_ADDRESS: "0x6eb2b30367eC03180De7138a29448F8B11cCED8a"
          VITE_MARKETPLACE_ADDRESS: "0xA5eb9E9738eF948DCFcF8e5146e3a87545879564"
          VITE_USDC_ADDRESS: "0x59b47ddcbfd04bd5796332B38E1A62445Eb3985B"
          VITE_PLATFORM_WALLET: "0x89eD8201B0448B2C94ae0e4D380f08b7aD558Ce6"
          VITE_CHAIN_ID: "84532"
          VITE_TRANSAK_API_KEY: a5b83d94-8b71-4ff1-ac8a-0cc88c6ae5e0
          VITE_TRANSAK_ENVIRONMENT: STAGING
          VITE_GOOGLE_CLIENT_ID: 338330586933-u9j6r5kre5a8tbht14pp2jokh7d32qi5.apps.googleusercontent.com
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_51SHewG3UIHQiuHTy62JP9SiQzYm4kVI8uDg158N2RxzmQMUKU0tr5zSVlrSwOCaGmIxFTwEJL59vKJ9cVDzWdUxH005IuFlux3

      # ── Build Admin Panel ──
      - name: 📦 Install admin dependencies
        working-directory: admin
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build admin
        working-directory: admin
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_BACKEND_URL: https://api.hypertek100.com
          VITE_FRONTEND_URL: https://www.hypertek100.com
          VITE_ADMIN_URL: https://admin.hypertek100.com
          VITE_MY_NFT_ADDRESS: "0x6eb2b30367eC03180De7138a29448F8B11cCED8a"
          VITE_MARKETPLACE_ADDRESS: "0xA5eb9E9738eF948DCFcF8e5146e3a87545879564"
          VITE_USDC_ADDRESS: "0x59b47ddcbfd04bd5796332B38E1A62445Eb3985B"
          VITE_CHAIN_ID: "84532"
          VITE_TRANSAK_API_KEY: a5b83d94-8b71-4ff1-ac8a-0cc88c6ae5e0
          VITE_TRANSAK_ENVIRONMENT: STAGING

      # ── Setup SSH ──
      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── Fix permissions ──
      - name: � Fix EC2 directory permissions
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo chown -R ubuntu:ubuntu /var/www/hypertek"

      # ── Deploy backend code (excluding node_modules, .env, and uploads) ──
      - name: 📤 Deploy backend code to EC2
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'Config/.env' \
            --exclude '.env' \
            --exclude 'uploads' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/hypertek/backend/

      # ── Deploy frontend dist ──
      - name: 📤 Deploy frontend build to EC2
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/hypertek/frontend/dist/

      # ── Deploy admin dist ──
      - name: 📤 Deploy admin build to EC2
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            admin/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/hypertek/admin/dist/

      # ── Install backend deps & restart services ──
      - name: 🔧 Install backend & restart services
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "═══════════════════════════════════════"
            echo "  🚀 HyperTek Deployment"
            echo "═══════════════════════════════════════"

            # ── Install backend dependencies ──
            echo "📦 Installing backend dependencies..."
            cd /var/www/hypertek/backend
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps

            # ── Ensure uploads directories exist ──
            mkdir -p uploads/temp uploads/news
            chmod 755 uploads uploads/temp uploads/news

            # ── Restart backend with PM2 ──
            echo "🔄 Restarting backend..."
            if pm2 describe hypertek-backend > /dev/null 2>&1; then
              pm2 restart hypertek-backend
            else
              PORT=4700 NODE_ENV=production pm2 start index.js --name hypertek-backend
              pm2 save
            fi

            # ── Reload Nginx ──
            echo "🔄 Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx

            echo ""
            echo "═══════════════════════════════════════"
            echo "  ✅ Deployment completed!"
            echo "═══════════════════════════════════════"
          EOF

      # ── Health Check ──
      - name: 🏥 Health check
        run: |
          echo "Waiting 10s for services to stabilize..."
          sleep 10

          FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" https://www.hypertek100.com || echo "000")
          ADMIN=$(curl -s -o /dev/null -w "%{http_code}" https://admin.hypertek100.com || echo "000")
          API=$(curl -s -o /dev/null -w "%{http_code}" https://api.hypertek100.com || echo "000")

          echo "Frontend:  $FRONTEND"
          echo "Admin:     $ADMIN"
          echo "API:       $API"

          if [ "$FRONTEND" = "000" ] && [ "$API" = "000" ]; then
            echo "⚠️  Services unreachable — check server"
            exit 1
          else
            echo "✅ Services are responding!"
          fi

      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

# =============================================================
# HyperTek — GitHub Actions CI/CD Pipeline
# =============================================================
# Trigger: Push to 'main' branch or manual
# Strategy: Build frontend/admin on GitHub runner → Deploy to EC2
# =============================================================

name: 🚀 Deploy HyperTek

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  NODE_VERSION: "20"
  DEPLOY_DIR: /var/www/hypertek

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build Frontend & Admin on GitHub Runner
  # (saves EC2 RAM — t3.small only has 2GB)
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build Frontend & Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      # ── Build User Frontend ──
      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # ── Build Admin Panel ──
      - name: 📦 Install admin dependencies
        working-directory: admin
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build admin
        working-directory: admin
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # ── Upload build artifacts for deploy job ──
      - name: 📤 Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

      - name: 📤 Upload admin build
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 2: Deploy to AWS EC2
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: 📥 Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: 📥 Download admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-dist

      # ── Setup SSH ──
      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── Pull latest backend code on server ──
      - name: � Pull latest code on EC2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            echo "📥 Pulling latest code..."
            cd /var/www/hypertek
            git fetch origin main
            git reset --hard origin/main
          EOF

      # ── Upload frontend dist → /var/www/hypertek/frontend/dist ──
      - name: 📤 Deploy frontend build to EC2
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend-dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/hypertek/frontend/dist/

      # ── Upload admin dist → /var/www/hypertek/admin/dist ──
      - name: 📤 Deploy admin build to EC2
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            admin-dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/hypertek/admin/dist/

      # ── Install backend deps & restart services ──
      - name: 🔧 Install backend & restart services
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "═══════════════════════════════════════"
            echo "  🚀 HyperTek Deployment"
            echo "═══════════════════════════════════════"

            # ── Install backend dependencies ──
            echo "📦 Installing backend dependencies..."
            cd /var/www/hypertek/backend
            npm ci --legacy-peer-deps --omit=dev || npm install --legacy-peer-deps --omit=dev

            # ── Restart backend with PM2 ──
            echo "🔄 Restarting backend..."
            if pm2 describe hypertek-backend > /dev/null 2>&1; then
              pm2 restart hypertek-backend
            else
              PORT=4700 NODE_ENV=production pm2 start index.js --name hypertek-backend
              pm2 save
            fi

            # ── Reload Nginx ──
            echo "🔄 Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx

            echo ""
            echo "═══════════════════════════════════════"
            echo "  ✅ Deployment completed!"
            echo "═══════════════════════════════════════"
          EOF

      # ── Health Check ──
      - name: 🏥 Health check
        run: |
          echo "Waiting 10s for services to stabilize..."
          sleep 10

          FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" https://www.hypertek100.com || echo "000")
          ADMIN=$(curl -s -o /dev/null -w "%{http_code}" https://admin.hypertek100.com || echo "000")
          API=$(curl -s -o /dev/null -w "%{http_code}" https://api.hypertek100.com || echo "000")

          echo "Frontend:  $FRONTEND"
          echo "Admin:     $ADMIN"
          echo "API:       $API"

          if [ "$FRONTEND" = "000" ] && [ "$API" = "000" ]; then
            echo "⚠️  Services unreachable — check server"
            exit 1
          else
            echo "✅ Services are responding!"
          fi

      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

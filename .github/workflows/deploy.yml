# =============================================================
# HyperTek — GitHub Actions CI/CD Pipeline
# Replaces old Jenkinsfile from previous developer
# =============================================================
# Trigger: Push to 'main' branch
# Strategy: Build on GitHub runner → Deploy to AWS EC2
# =============================================================

name: 🚀 Deploy HyperTek

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  NODE_VERSION: "20"
  DEPLOY_DIR: /var/www/hypertek
  FRONTEND_WEB_ROOT: /usr/share/nginx/html/hyper-tekgame
  ADMIN_WEB_ROOT: /usr/share/nginx/html/hyper-tekgame-admin
  BACKEND_PORT: 4700

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build Frontend & Admin on GitHub Runner
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build Frontend & Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      # ── Build User Frontend ──
      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # ── Build Admin Frontend ──
      - name: 📦 Install admin dependencies
        working-directory: admin
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build admin
        working-directory: admin
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # ── Upload build artifacts ──
      - name: 📤 Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

      - name: 📤 Upload admin build
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 2: Deploy to AWS EC2
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: 📥 Download admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-dist

      # ── Setup SSH ──
      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── Deploy Frontend builds via SCP ──
      - name: 📤 Upload frontend build to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo mkdir -p ${{ env.FRONTEND_WEB_ROOT }} && sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} ${{ env.FRONTEND_WEB_ROOT }}"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend-dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.FRONTEND_WEB_ROOT }}/

      - name: 📤 Upload admin build to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo mkdir -p ${{ env.ADMIN_WEB_ROOT }} && sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} ${{ env.ADMIN_WEB_ROOT }}"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            admin-dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.ADMIN_WEB_ROOT }}/

      # ── Deploy Backend ──
      - name: 🔧 Deploy backend & restart services
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'DEPLOY_SCRIPT'
            set -e

            echo "═══════════════════════════════════════"
            echo "  🚀 HyperTek Deployment Starting..."
            echo "═══════════════════════════════════════"

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            BACKEND_DIR="$DEPLOY_DIR/backend"

            # ── Ensure deploy directory exists ──
            sudo mkdir -p $DEPLOY_DIR
            sudo chown -R $USER:$USER $DEPLOY_DIR

            # ── Pull latest code ──
            if [ -d "$DEPLOY_DIR/.git" ]; then
              echo "📥 Pulling latest code..."
              cd $DEPLOY_DIR
              git fetch origin main
              git reset --hard origin/main
            else
              echo "📥 Cloning repository..."
              git clone --branch main --single-branch git@github.com:${{ github.repository }}.git $DEPLOY_DIR
            fi

            # ── Install backend dependencies ──
            echo "📦 Installing backend dependencies..."
            cd $BACKEND_DIR
            npm ci --legacy-peer-deps --omit=dev || npm install --legacy-peer-deps --omit=dev

            # ── Restart backend with PM2 ──
            echo "🔄 Restarting backend..."
            if pm2 describe hyper-tek-backend > /dev/null 2>&1; then
              pm2 restart hyper-tek-backend
            else
              cd $BACKEND_DIR
              PORT=${{ env.BACKEND_PORT }} NODE_ENV=production pm2 start index.js --name hyper-tek-backend
              pm2 save
            fi

            # ── Fix ownership for nginx ──
            echo "🔧 Fixing file permissions..."
            sudo chown -R www-data:www-data ${{ env.FRONTEND_WEB_ROOT }} || true
            sudo chown -R www-data:www-data ${{ env.ADMIN_WEB_ROOT }} || true

            # ── Reload Nginx (graceful, no downtime) ──
            echo "🔄 Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx

            echo ""
            echo "═══════════════════════════════════════"
            echo "  ✅ Deployment completed successfully!"
            echo "═══════════════════════════════════════"
          DEPLOY_SCRIPT

      # ── Health Check ──
      - name: 🏥 Health check
        run: |
          echo "Waiting 10 seconds for services to stabilize..."
          sleep 10

          # Check frontend
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.hypertek100.com || echo "000")
          echo "Frontend status: $FRONTEND_STATUS"

          # Check backend API
          BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.hypertek100.com || echo "000")
          echo "Backend API status: $BACKEND_STATUS"

          if [ "$FRONTEND_STATUS" = "000" ] && [ "$BACKEND_STATUS" = "000" ]; then
            echo "⚠️ Warning: Both services unreachable. Check DNS/SSL configuration."
          else
            echo "✅ Services are responding"
          fi

      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
